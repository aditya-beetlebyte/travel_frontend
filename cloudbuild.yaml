# Build frontend Docker image for Cloud Run.
# Build succeeds without _NEXT_PUBLIC_API_URL; set NEXT_PUBLIC_API_URL on the Cloud Run service at runtime.
# Optional: bake URL at build time:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_NEXT_PUBLIC_API_URL=https://YOUR-BACKEND.run.app

substitutions:
  _REGION: asia-south1
  _REPO: travel
  _IMAGE: frontend
  # Required — pass your backend URL when triggering the build:
  # --substitutions=_NEXT_PUBLIC_API_URL=https://YOUR-BACKEND.run.app
  _NEXT_PUBLIC_API_URL: ""

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
